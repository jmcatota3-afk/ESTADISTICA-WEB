    // fight the picker). While a composer or thread card is open the arrow
    // returns, so the bubble cursor and the pin just placed never show at
    // once. Keyed on <html> data attributes, which page scripts that
    // rewrite body.className leave alone; ":not(#_)" lifts the rules to

        c === 0x070f ||
        c === 0xad ||

        c === 0x115f ||
        c === 0x1160 ||
        c === 0x180e ||
        (c >= 0x200b && c <= 0x200f) ||
        (c >= 0x202a && c <= 0x202e) ||
        (c >= 0x2060 && c <= 0x2064) ||
        (c >= 0x2066 && c <= 0x2069) ||

        parent &&
        parent.id &&
        !hasInvisibles(parent.id) &&
        isUnique("#" + CSS.escape(parent.id))

  function descriptorFor(el) {

    // #artifacts-component-root-* wrapper which is implementation noise.
    var section = el.parentElement;
    while (
      section &&
      (!section.id || section.id.indexOf("artifacts-component-root") === 0)

  }

  // textContent offset of (node, offset) within body - the coordinate
  // system text-quote anchors are stored in. -1 when the boundary
  // isn't under body (shadow root, detached).
  function textOffset(node, offset) {
    var body = document.body;

        range.setStart(t, start - acc);
        haveStart = true;

        range.setEnd(t, end - acc);
        return range;
      }
      acc = next;
    }
    return null;
  }

  // Context-scored search (W3C text-quote resolution): slice-check the
  // hint, else pick the occurrence whose surrounding chars best match
  // prefix/suffix. MIRRORS locateTextQuote() above line-for-line - the
  // tested export is the contract; this copy is what the sandbox runs.
  function locateQuote(text, q) {
    var ex = q.exact;
    if (!ex) return null;
    var hint = q.startOffset >= 0 ? q.startOffset : 0;
    if (text.slice(hint, hint + ex.length) === ex) {
      return { start: hint, end: hint + ex.length };

    var bestScore = -1;
    var bestDist = Infinity;
    var scanned = 0;
    for (var idx = text.indexOf(ex); idx !== -1 && ++scanned <= 1000; idx = text.indexOf(ex, idx + 1)) {
      var before = text.slice(Math.max(0, idx - CONTEXT_LEN), idx);
      var after = text.slice(idx + ex.length, idx + ex.length + CONTEXT_LEN);

      for (var i = 1; i <= q.prefix.length && i <= before.length; i++) {

      hoverEl !== document.body &&

    if (!port) return;

    var pinX = rect.width > 0 ? (ev.clientX - rect.left) / rect.width : 0.5;

  function reportRects() {
    rafPending = false;

    // inspector tag / composer glued through scroll and reflow.
    if (selected) {
      var sr = selected.getBoundingClientRect();
      port.postMessage({
        type: "selRect",

        top: sr.top,

      var p = pins[i];

        el = document.querySelector(p.selector);
      } catch (e) {

        continue;
      }
      var r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) {
        rects.push({ id: p.id, x: 0, y: 0, found: false });

      }

        id: p.id,
        x: r.left + p.pinX * r.width,
        y: r.top + p.pinY * r.height,

    if (quotes.length > 0) {
      var live = null;
      for (var qi = 0; qi < quotes.length; qi++) {

          qr = (loc && rangeForOffsets(loc.start, loc.end)) || null;
          quoteRanges[q.id] = qr;

        // not-found so the host docks it as detached instead of
        // rendering nothing clickable.

        quoteRects.push(
          qlr.length > 0
            ? { id: q.id, found: true, lineRects: qlr }

      type: "rects",
      rects: rects,
      quoteRects: quoteRects,
      scrollY: window.scrollY || 0,

  function scheduleRects() {
    if (rafPending) return;
    rafPending = true;
    var done = false;
    function run() {
      if (done) return;
      done = true;
      reportRects();
    }
    // rAF for paint alignment, with a timeout fallback - rAF is
    // suspended entirely in hidden tabs and pins must still settle
    // when the tab becomes visible after background loading.
    requestAnimationFrame(run);
    setTimeout(run, 150);
  }

  function setMode(on) {
    mode = !!on;
    document.documentElement.toggleAttribute("data-cwhr-mode", mode);
    if (!mode) {
      hoverEl = null;
      clearSelection();
    }
  }

  function setComposing(open) {
    document.documentElement.toggleAttribute("data-cwhr-composing", !!open);
  }

  function onPortMessage(ev) {
    var data = ev.data;
    if (!data) return;
    if (data.type === "mode") setMode(data.on);

      pins = Array.isArray(data.pins) ? data.pins : [];

    var channel = new _MessageChannel();
    port = channel.port1;
    port.onmessage = onPortMessage;

      "*",

    // pointer leaves the viewport - capture-phase on document would fire for
    // every intra-document element-boundary crossing.
    document.documentElement.addEventListener("mouseleave", onMouseLeave);
    document.addEventListener("click", onClick, true);
    // Text-selection capture: commit on mouseup/keyup (Shift+Arrow),
    // clear on collapse. Not mode-gated; highlight-to-comment is
    // always on.
    function onSelCommit() { reportTextSel(true); }
    document.addEventListener("mouseup", onSelCommit, true);
    document.addEventListener("keyup", onSelCommit, true);
    document.addEventListener("selectionchange", function () {
      var s = window.getSelection();
      if (hasTextSel && (!s || s.isCollapsed)) reportTextSel(false);
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && port) port.postMessage({ type: "dismiss" });
    }, true);
    // Scroll/resize move the hovered element under a stationary pointer -
    // re-report its rect so the host's inspector box tracks it. Mutations
    // stay rects-only (animating pages would chatter the cursor stream).
    var textSelPending = false;
    function scheduleTextSel() {
      if (textSelPending) return;
      textSelPending = true;
      requestAnimationFrame(function () {
        textSelPending = false;
        reportTextSel(false);
      });
    }
    function onLayoutChange() {
      scheduleRects();
      if (mode && hoverEl) scheduleCursor();
      if (hasTextSel) scheduleTextSel();
    }
    window.addEventListener("scroll", onLayoutChange, true);
    window.addEventListener("resize", onLayoutChange);
    // Full-cache invalidate per childList mutation is acceptable: CSS
    // animation doesn't fire the observer; JS writers at frame rate
    // would re-relocate every frame but are rare. characterData isn't
    // observed, so .data= edits leave highlights stale until the next
    // childList mutation.
    var observer = new MutationObserver(function () {
      quoteRanges = Object.create(null);
      scheduleRects();
      if (hasTextSel) scheduleTextSel();
    });
    function observe() {
      if (document.body) observer.observe(document.body, { childList: true, subtree: true });
    }
    if (document.body) observe();
    else document.addEventListener("DOMContentLoaded", observe);
    // Settle pins after late layout (fonts, images).
    setInterval(scheduleRects, 2000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

body{margin:0;min-height:100vh;font:16px/1.5 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:#f4f9ff fixed;background-size:cover;background-position:center}
body::before{content:"";position:fixed;inset:-12px;background:var(--bgimg,none) center/cover no-repeat;filter:blur(3px);pointer-events:none}
#app{position:relative;max-width:960px;margin:0 auto;padding:76px 18px 40px;min-height:100vh}
h1,h2{margin:0 0 16px;text-align:center;color:var(--ink)}
h2{font-family:Georgia,serif;font-size:clamp(1.6rem,4vw,2.4rem);display:table;margin:0 auto 16px;background:#164a7a;color:#fff;padding:.3em .8em;border-radius:14px}
h3{display:table;background:#2271bb;color:#fff;padding:.3em .9em;border-radius:10px;margin:26px 0 12px;text-transform:uppercase;letter-spacing:.06em;font-size:1rem}
button,.btn{font:inherit;cursor:pointer;border:1.5px solid #8cc5ee;background:#d8ebfc;color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:600;display:inline-block}
button:hover,.btn:hover{background:#c2dff8}button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid #1f6fb5;outline-offset:2px}
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72vh;gap:22px;text-align:center}
.uni{font:700 clamp(1.8rem,5.6vw,3.4rem)/1.1 Georgia,serif;text-transform:uppercase;color:#fff;background:#164a7a;padding:.35em .7em;border-radius:14px}
.home h1{font-size:clamp(1.3rem,3.4vw,2rem);max-width:780px;margin:0}
.grupo{font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#1f6fb5;border:1.5px solid var(--acc);border-radius:99px;padding:4px 22px;background:#fff}
.row3{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.big{font-size:1.2rem;padding:22px 40px;min-width:190px;background:#2271bb;border-color:#2271bb;color:#fff}
.big:hover{background:#1b62a3}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.slot{display:flex;flex-direction:column;gap:6px}
.open{width:100%;text-align:left;background:var(--card);border-color:var(--line);padding:16px}
.open:hover{background:#f1f8ff}
.open small{display:block;font-weight:400;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder{background:#d3e9fb;border-color:#9fcdf0;text-align:center;padding:28px 10px;font-size:1.05rem}
.folder:hover{background:#c3def7}
.mini{display:flex;gap:6px;flex-wrap:wrap}.mini .btn,.mini button{padding:4px 10px;font-size:.85rem}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.top .sp{flex:1}.top button,.top .btn{padding:6px 12px;font-size:.9rem}
#view{position:fixed;inset:0;z-index:9;background:rgba(18,34,56,.94);display:none;flex-direction:column;padding:14px;gap:10px}
#view.on{display:flex}#view .bar{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#fff}
#view .box{flex:1;display:grid;place-items:center;min-height:0}
#view video,#view iframe,#view img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;border:0;background:#000}
#view iframe{background:#fff}
.nofile{color:#fff;text-align:center}
.blk{display:table;margin:0 auto 16px;background:#164a7a;color:#fff;padding:.3em .8em;border-radius:14px}
#deco{position:fixed;inset:0;pointer-events:none}.d{position:absolute;width:var(--s);height:var(--s);transform:rotate(var(--r));animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(22,74,122,.25))}
@keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-10px) rotate(var(--r))}}
@media (max-width:900px){#deco{display:none}}@media (prefers-reduced-motion:reduce){.d{animation:none}}
.note{display:table;margin:-6px auto 14px;background:#fff;color:var(--ink);padding:.2em .9em;border-radius:99px;border:1.5px solid var(--acc)}
#ask{position:fixed;inset:0;z-index:20;background:rgba(18,34,56,.5);display:none;place-items:center;padding:16px}#ask.on{display:grid}
.askbox{background:#fff;border:1.5px solid var(--acc);border-radius:14px;padding:20px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.askbox input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:#f3f9ff;color:var(--ink);width:100%}
#ae{color:#c0392b;min-height:1.2em;font-size:.9rem}.askbox .r{display:flex;gap:8px;justify-content:flex-end}

<script>

(function(){

 if(st.v==='home'){h='<div class="home"><div class="uni">Universidad de las Fuerzas Armadas ESPE</div><h1>Nivel de exposición a fraudes electrónicos en estudiantes universitarios</h1><div class="grupo">Grupo 6</div><div class="row3">'+[1,2,3].map(function(n){return '<button class="big" data-go="p" data-p="'+n+'">Parcial '+n+'</button>'}).join('')+'</div></div>'}

 else{var q=st.p,s=st.s,b=q+':'+s+':';

 if(st.v==='s')t+='<button data-go="p" data-p="'+st.p+'">← '+PN[st.p]+'</button>';
 if(!D.final){t+='<span class="sp"></span><button data-ed="1">'+(edit?'Terminar edición':'Modo edición')+'</button>';

function readFile(f,cb){var r=new FileReader();r.onload=function(){cb(r.result)};r.readAsDataURL(f)}

 r.readAsDataURL(f);i.value=''});

 var j=JSON.stringify(c).replace(/</g,'\\u003c');
